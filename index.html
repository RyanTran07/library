<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">Library App</div>
        <div class="books-container"> </div>

        <button class="new-book-btn">New Book</button>
    </div>

    <dialog class="new-book-dialog">
        <form method="dialog" class="new-book-form">
            <div class="new-book-form-title">Add a New Book</div>

            <div class="input-form">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="input-form">
                <label for="author">Author</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="input-form">
                <label for="pages">Pages</label>
                <input type="number" id="pages" name="pages" min="1" required>
            </div>

            <div class="input-form">
                <label for="isRead">Have you read this book yet?</label>
                <input type="checkbox" id="isRead" name="isRead" required>
            </div>

            <div class="dialog-buttons">
                <button type="submit" class= "button submit-btn" >Add Book</button>
                <button class="cancel-btn" type="button">Cancel</button>
            </div>
        </form>
    </dialog>
</body>
</html>
